; Scribble Run firmware - PlatformIO project (MIT).  docs/build-plan.md, Step 0.
;   pio run -e cores3            build the device firmware (M5Stack CoreS3)
;   pio run -e cores3 -t upload  flash it over USB-C
;   pio test -e native           run the portable-core unit tests on this computer (no device needed)

[platformio]
default_envs = cores3

[env]
; one source of truth for constants: shared/constants.json -> shared/generated/config.h (node tools/gen-config.mjs)
build_flags = -std=gnu++17 -Wall -I$PROJECT_DIR/../shared/generated
build_unflags = -std=gnu++11

[env:cores3]
platform = espressif32@8.0.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
lib_deps = m5stack/M5Unified@0.3.0
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; The day-one hardware-check app (build-plan Steps 1-3):  pio run -e hwcheck -t upload
[env:hwcheck]
extends = env:cores3
build_src_filter = -<*> +<../hwcheck/>

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>            ; only lib/core (the portable code) is built for the PC tests
build_flags = ${env.build_flags} -O2 -DUNITY_INCLUDE_DOUBLE

; The PC emulator: the real src/*.cpp compiled against M5GFX's SDL display (see emu/README.md).
; Build and run:  pio run -e emu && .pio/build/emu/program     (interactive window; mouse = finger, arrows = tilt)
; Headless script run:  EMU_SCRIPT=emu/scripts/x.txt SDL_VIDEODRIVER=dummy .pio/build/emu/program
[env:emu]
platform = native
build_flags = ${env.build_flags} -O1 -g -DEMU -I$PROJECT_DIR/emu/include -lSDL2
build_src_filter = +<*> +<../emu/src/>
lib_deps = m5stack/M5GFX@0.3.0
lib_ldf_mode = chain+
test_ignore = *

[env:emu_hwcheck]
extends = env:emu
build_src_filter = -<*> +<../hwcheck/> +<../emu/src/>

; Dev gallery: every Renderer / UI building block on one screen at a time (emu/gallery/gallery_main.cpp). Needs no Input/Audio/LevelStore/Game.
;   pio run -e emu_gallery && EMU_SCRIPT=emu/scripts/gallery.txt SDL_VIDEODRIVER=dummy .pio/build/emu_gallery/program
[env:emu_gallery]
extends = env:emu
build_flags = ${env:emu.build_flags} -I$PROJECT_DIR/src/app
build_src_filter = -<*> +<app/renderer.cpp> +<app/ui.cpp> +<../emu/gallery/> +<../emu/src/>
